[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cancelstorm"
version = "0.1.0"
description = "Deterministic asyncio checkpoint fault injection and cleanup auditing"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Cancelstorm contributors"}]
keywords = ["asyncio", "cancellation", "testing", "fault-injection", "pytest"]
classifiers = ["Programming Language :: Python :: 3", "Framework :: Pytest", "Topic :: Software Development :: Testing"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.11,<1"]

[project.entry-points.pytest11]
cancelstorm = "cancelstorm.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cancelstorm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
